<section id="skills" class="py-5">
  <div class="container">
    <h2 class="text-center mb-5 fw-bold">My Skills</h2>
    
    <div class="row">
      <div class="col-lg-4 mb-4" *ngFor="let category of skillCategories">
        <div class="card h-100 shadow border-0">
          <div class="card-body">
            <div class="text-center mb-4">
              <i [class]="category.icon + ' fa-3x mb-3'" [style.color]="category.color"></i>
              <h4>{{ category.title }}</h4>
            </div>
            
            <div *ngFor="let skill of category.skills" class="mb-3">
              <div class="d-flex justify-content-between mb-1">
                <span class="fw-medium">{{ skill.name }}</span>
                <span class="text-muted">{{ skill.level }}%</span>
              </div>
              <div class="progress" style="height: 8px;">
                <div class="progress-bar" 
                     [style.width.%]="skill.level" 
                     [style.background-color]="category.color"
                     role="progressbar">
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
