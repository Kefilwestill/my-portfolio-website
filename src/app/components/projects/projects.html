<section id="portfolio" class="py-5" style="background-color: #f8f9fa;">
  <div class="container">
    <h2 class="text-center mb-5 fw-bold">My Projects</h2>
    
    <div class="row">
      <div class="col-md-10 col-lg-8 mx-auto mb-4" *ngFor="let project of projects">
        <div class="card h-100 shadow-sm border-0 flex-md-row" 
             [class.border-primary]="project.featured" 
             [style.border-width]="project.featured ? '3px' : '0'">
          
          <span *ngIf="project.featured" 
                class="badge bg-primary position-absolute top-0 end-0 m-3">
            Featured
          </span>
          
          <img [src]="project.image" [alt]="project.title" class="project-thumb">
          
          <div class="card-body d-flex flex-column">
            <h5 class="card-title">{{ project.title }}</h5>
            <p class="card-text text-muted flex-grow-1">{{ project.description }}</p>
            
            <div class="mb-3">
              <span *ngFor="let tech of project.technologies" 
                    class="badge bg-secondary me-1 mb-1">
                {{ tech }}
              </span>
            </div>
            
            <div class="d-flex gap-2">
              <a [href]="project.githubUrl" target="_blank" class="btn btn-outline-dark btn-sm flex-grow-1">
                <i class="fab fa-github"></i> Code
              </a>
              <a [href]="project.liveUrl" 
                 [class.disabled]="project.liveUrl === '#'"
                 target="_blank" 
                 rel="noopener"
                 class="btn btn-primary btn-sm flex-grow-1">
                <i class="fas fa-external-link-alt"></i> Live Demo
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
